# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "slava's words"
  pageTitleSuffix: " | slava's words"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
    host: https://plausible.io
  locale: ru-RU
  baseUrl: slava.blog
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Space Grotesk
      body: Literata
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/table-of-contents"
    enabled: true
    options:
      collapseByDefault: true
      layout: modern
    order: 50
    layout:
      position: right
      priority: 20

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: local
      header: Space Grotesk
      body: Literata
      code: IBM Plex Mono
      interface: Space Grotesk

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: true
    options:
      colorScheme: darkMode
      width: 1200
      height: 630
      excludeRoot: false

  - source: "@quartz-community/cname"
    enabled: true

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: Свежие заметки
      limit: 8
      showTags: true
      linkToMore: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: left
      priority: 40
      display: desktop-only

  - source: "@quartz-community/explorer"
    enabled: true
    options:
      useSavedState: true
    layout:
      position: left
      priority: 50
      display: desktop-only

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: true
      showComma: false
    layout:
      position: beforeBody
      priority: 20

  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/graph"
    enabled: true
    options:
      localGraph:
        depth: 2
        scale: 1
        linkDistance: 45
        showTags: true
      globalGraph:
        depth: 2
        scale: 0.85
        linkDistance: 50
        showTags: false
        removeTags:
          - home
    layout:
      position: right
      priority: 30
      display: desktop-only

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 40

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Slavikss
        Telegram: https://t.me/slavaswords
        LinkedIn: https://linkedin.com/in/vguch
    layout:
      position: footer
      priority: 50

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
